[project]
name = "async-payment-processing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dan Ult", email = "ulturgashev112@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "faststream[cli,rabbit]>=0.7.7",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.2",
    "uvicorn>=0.54.0",
    "yarl>=1.25.1",
]

[tool.uv]
package = false

[project.scripts]
async-payment-processing = "async_payment_processing:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
